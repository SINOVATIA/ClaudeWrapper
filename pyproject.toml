[project]
name = "claude-wrapper"
version = "0.1.0"
description = "MCP server that wraps the Claude Code CLI and exposes it as a callable service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
claude-wrapper = "claude_wrapper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_wrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
